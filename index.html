<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>WeatherNow</title><script src="https://cdn.tailwindcss.com"></script><style>body{font-family:sans-serif}</style></head>
<body class="min-h-screen bg-[#0a0a0f] text-white flex items-center justify-center p-4">
<div class="w-full max-w-[420px] text-center">
<h1 class="text-4xl font-bold">Weather<span class="text-violet-400">Now</span></h1>
<p class="text-zinc-400 mt-2 mb-6">Live weather, no API key</p>
<div class="bg-zinc-900 border border-zinc-800 rounded-[24px] p-6 text-left">
<div class="flex gap-2"><input id="city" value="Kolkata" class="flex-1 bg-zinc-800 border border-zinc-700 rounded-xl px-4 py-3 outline-none text-white"/><button onclick="getWeather()" class="bg-violet-600 px-6 rounded-xl font-bold">Search</button></div>
<div id="status" class="text-center py-4 text-zinc-400"></div>
<div id="result" class="hidden text-center">
<h2 id="cityName" class="text-2xl font-bold mt-4"></h2>
<div id="temp" class="text-7xl font-bold mt-4"></div>
<p id="desc" class="text-xl text-zinc-300 mt-2"></p>
<div class="grid grid-cols-3 gap-3 mt-6"><div class="bg-zinc-800 rounded-xl p-3"><p class="text-zinc-400 text-xs">WIND</p><p id="wind" class="font-bold"></p></div><div class="bg-zinc-800 rounded-xl p-3"><p class="text-zinc-400 text-xs">HUMIDITY</p><p id="hum" class="font-bold"></p></div><div class="bg-zinc-800 rounded-xl p-3"><p class="text-zinc-400 text-xs">FEELS</p><p id="feels" class="font-bold"></p></div></div>
</div>
</div></div>
<script>
async function getWeather(){
let city=document.getElementById('city').value.trim();
if(!city)return;
let statusEl=document.getElementById('status');
statusEl.textContent='Fetching weather for '+city+'...';
statusEl.classList.remove('hidden');
try{
let geo=await fetch('https://geocoding-api.open-meteo.com/v1/search?name='+encodeURIComponent(city)+'&count=1');
let gData=await geo.json();
if(!gData.results)throw new Error('City not found - try Delhi');
let loc=gData.results[0];
let w=await fetch('https://api.open-meteo.com/v1/forecast?latitude='+loc.latitude+'&longitude='+loc.longitude+'&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m');
let wData=await w.json();
let cur=wData.current;
let codes={0:'Clear sky',1:'Mainly clear',2:'Partly cloudy',3:'Overcast',45:'Fog',61:'Rain',95:'Thunder'};
document.getElementById('cityName').textContent=loc.name+', '+loc.country;
document.getElementById('temp').textContent=Math.round(cur.temperature_2m)+'°C';
document.getElementById('desc').textContent=codes[cur.weather_code]||'Cloudy';
document.getElementById('wind').textContent=cur.wind_speed_10m+' km/h';
document.getElementById('hum').textContent=cur.relative_humidity_2m+'%';
document.getElementById('feels').textContent=Math.round(cur.apparent_temperature)+'°C';
document.getElementById('result').classList.remove('hidden');
statusEl.textContent='';
}catch(e){statusEl.textContent='Error: '+e.message+' Check internet';}
}
window.onload=getWeather;
</script>
</body></html>
