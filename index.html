<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WeatherNow - World Edition</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-[#070A14] text-white flex justify-center p-3">
<div class="w-full max-w-[480px]">
  <h1 class="text-center text-3xl font-black mt-4">Weather<span class="text-violet-400">World</span></h1>
  <p class="text-center text-zinc-500 text-sm mb-5">Search ANY city on Earth</p>

  <div class="bg-zinc-900/80 border border-zinc-800 rounded-[28px] p-5 backdrop-blur">
    <div class="flex gap-2">
      <input id="city" placeholder="Search any city... e.g. Tokyo" class="flex-1 bg-zinc-800 border border-zinc-700 rounded-2xl px-4 py-3.5 outline-none focus:border-violet-500 text-white"/>
      <button onclick="getWeather()" class="bg-violet-600 hover:bg-violet-500 px-6 rounded-2xl font-bold">Go</button>
    </div>

    <p class="text-[11px] text-zinc-500 mt-3 uppercase tracking-widest">Popular Cities - 1 Click</p>
    <div class="grid grid-cols-3 gap-2 mt-2">
      <button onclick="quick('London')" class="bg-zinc-800 hover:bg-zinc-700 rounded-xl py-2 text-sm">🇬🇧 London</button>
      <button onclick="quick('Tokyo')" class="bg-zinc-800 hover:bg-zinc-700 rounded-xl py-2 text-sm">🇯🇵 Tokyo</button>
      <button onclick="quick('New York')" class="bg-zinc-800 hover:bg-zinc-700 rounded-xl py-2 text-sm">🇺🇸 NY</button>
      <button onclick="quick('Dubai')" class="bg-zinc-800 hover:bg-zinc-700 rounded-xl py-2 text-sm">🇦🇪 Dubai</button>
      <button onclick="quick('Paris')" class="bg-zinc-800 hover:bg-zinc-700 rounded-xl py-2 text-sm">🇫🇷 Paris</button>
      <button onclick="quick('Sydney')" class="bg-zinc-800 hover:bg-zinc-700 rounded-xl py-2 text-sm">🇦🇺 Sydney</button>
      <button onclick="quick('Kolkata')" class="bg-zinc-800 hover:bg-zinc-700 rounded-xl py-2 text-sm">🇮🇳 Kolkata</button>
      <button onclick="quick('Baghpat')" class="bg-zinc-800 hover:bg-zinc-700 rounded-xl py-2 text-sm">📍 Baghpat</button>
      <button onclick="quick('Moscow')" class="bg-zinc-800 hover:bg-zinc-700 rounded-xl py-2 text-sm">🇷🇺 Moscow</button>
    </div>

    <div id="status" class="text-center py-6 text-zinc-400 text-sm"></div>

    <div id="result" class="hidden">
      <div class="text-center mt-6">
        <h2 id="cityName" class="text-2xl font-bold"></h2>
        <p id="coords" class="text-zinc-500 text-xs mt-1"></p>
        <div id="temp" class="text-7xl font-black mt-4 tracking-tight"></div>
        <p id="desc" class="text-lg text-zinc-200 mt-1"></p>
        <span id="country" class="inline-block mt-3 bg-zinc-800 border border-zinc-700 rounded-full px-3 py-1 text-xs"></span>
      </div>
      <div class="grid grid-cols-3 gap-3 mt-7">
        <div class="bg-zinc-800 rounded-2xl p-4 text-center"><p class="text-zinc-500 text-[10px]">WIND</p><p id="wind" class="font-bold text-lg mt-1"></p></div>
        <div class="bg-zinc-800 rounded-2xl p-4 text-center"><p class="text-zinc-500 text-[10px]">HUMIDITY</p><p id="hum" class="font-bold text-lg mt-1"></p></div>
        <div class="bg-zinc-800 rounded-2xl p-4 text-center"><p class="text-zinc-500 text-[10px]">FEELS LIKE</p><p id="feels" class="font-bold text-lg mt-1"></p></div>
      </div>
    </div>
  </div>
  <p class="text-center text-zinc-600 text-[11px] mt-5">Data: Open-Meteo • No API key • Whole World</p>
</div>

<script>
function quick(c){document.getElementById('city').value=c; getWeather();}
async function getWeather(){
  let city=document.getElementById('city').value.trim(); if(!city) city='Baghpat';
  let s=document.getElementById('status'); let r=document.getElementById('result');
  s.textContent='🌍 Searching '+city+' across the world...'; r.classList.add('hidden');
  try{
    let geo=await fetch('https://geocoding-api.open-meteo.com/v1/search?name='+encodeURIComponent(city)+'&count=1&language=en&format=json');
    let g=await geo.json(); if(!g.results||!g.results[0]) throw new Error('City not found. Try London, Tokyo, Delhi');
    let loc=g.results[0];
    let wf=await fetch('https://api.open-meteo.com/v1/forecast?latitude='+loc.latitude+'&longitude='+loc.longitude+'&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m&timezone=auto');
    let w=await wf.json(); let cur=w.current;
    let codes={0:'Clear Sky ☀️',1:'Mainly Clear 🌤️',2:'Partly Cloudy ⛅',3:'Overcast ☁️',45:'Foggy 🌫️',51:'Light Drizzle 🌦️',61:'Rain 🌧️',71:'Snow ❄️',80:'Rain Showers 🌧️',95:'Thunderstorm ⛈️'};
    document.getElementById('cityName').textContent=loc.name;
    document.getElementById('coords').textContent=loc.latitude.toFixed(2)+', '+loc.longitude.toFixed(2)+' • '+loc.timezone;
    document.getElementById('country').textContent=loc.country+' • '+loc.admin1||'';
    document.getElementById('temp').textContent=Math.round(cur.temperature_2m)+'°C';
    document.getElementById('desc').textContent=codes[cur.weather_code]||'Cloudy ☁️';
    document.getElementById('wind').textContent=cur.wind_speed_10m+' km/h';
    document.getElementById('hum').textContent=cur.relative_humidity_2m+'%';
    document.getElementById('feels').textContent=Math.round(cur.apparent_temperature)+'°C';
    s.textContent=''; r.classList.remove('hidden');
  }catch(e){ s.textContent='❌ '+e.message; }
}
document.getElementById('city').addEventListener('keydown',e=>{if(e.key==='Enter') getWeather();});
window.onload=()=>{
  document.getElementById('city').value='';
  document.getElementById('status').textContent='🔍 Type a city and press Go - Whole World Weather';
}
</script>
</body>
</html>
