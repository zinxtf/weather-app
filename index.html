<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WeatherNow</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
<style>body{font-family:'Space Grotesk',sans-serif}</style>
</head>
<body class="min-h-screen bg-[#0a0a0f] text-white flex items-center justify-center p-4">
<div class="w-full max-w-[420px]">
  <div class="text-center mb-8">
    <h1 class="text-4xl font-bold">Weather<span class="text-violet-400">Now</span></h1>
    <p class="text-zinc-400 mt-2">Live weather, no API key</p>
  </div>
  <div class="bg-zinc-900 border border-zinc-800 rounded-[24px] p-6">
    <div class="flex gap-2 mb-6">
      <input id="city" placeholder="Search city... Delhi" class="flex-1 bg-zinc-800 border border-zinc-700 rounded-xl px-4 py-3 outline-none focus:border-violet-500" />
      <button onclick="getWeather()" class="bg-violet-600 px-6 rounded-xl font-bold">Search</button>
    </div>
    <div id="result" class="hidden text-center py-4">
      <h2 id="cityName" class="text-2xl font-bold"></h2>
      <p id="date" class="text-zinc-400 text-sm mt-1"></p>
      <div class="text-7xl font-bold mt-6" id="temp"></div>
      <p id="desc" class="text-xl text-zinc-300 mt-2 capitalize"></p>
      <div class="grid grid-cols-3 gap-3 mt-8">
        <div class="bg-zinc-800 rounded-xl p-3"><p class="text-zinc-400 text-xs">WIND</p><p id="wind" class="font-bold mt-1"></p></div>
        <div class="bg-zinc-800 rounded-xl p-3"><p class="text-zinc-400 text-xs">HUMIDITY</p><p id="hum" class="font-bold mt-1"></p></div>
        <div class="bg-zinc-800 rounded-xl p-3"><p class="text-zinc-400 text-xs">FEELS</p><p id="feels" class="font-bold mt-1"></p></div>
      </div>
    </div>
    <div id="loading" class="hidden text-center py-10 text-zinc-400">Fetching weather...</div>
    <p id="error" class="hidden text-center py-4 text-red-400"></p>
  </div>
</div>
<script>
async function getWeather(){
  const city=document.getElementById('city').value.trim();
  if(!city) return;
  document.getElementById('loading').classList.remove('hidden');
  document.getElementById('result').classList.add('hidden');
  document.getElementById('error').classList.add('hidden');
  try{
    const geo=await fetch(https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1&language=en&format=json);
    const gData=await geo.json();
    if(!gData.results ||!gData.results[0]) throw new Error('City not found');
    const loc=gData.results[0];
    const weather=await fetch(https://api.open-meteo.com/v1/forecast?latitude=${loc.latitude}&longitude=${loc.longitude}&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m&timezone=auto);
    const wData=await weather.json();
    const cur=wData.current;
    const codes={0:'Clear sky',1:'Mainly clear',2:'Partly cloudy',3:'Overcast',45:'Fog',51:'Light drizzle',61:'Slight rain',71:'Slight snow',95:'Thunderstorm'};
    document.getElementById('cityName').textContent=${loc.name}, ${loc.country};
    document.getElementById('date').textContent=new Date().toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'short'});
    document.getElementById('temp').textContent=${Math.round(cur.temperature_2m)}°C;
    document.getElementById('desc').textContent=codes[cur.weather_code]||'Cloudy';
    document.getElementById('wind').textContent=${cur.wind_speed_10m} km/h;
    document.getElementById('hum').textContent=${cur.relative_humidity_2m}%;
    document.getElementById('feels').textContent=${Math.round(cur.apparent_temperature)}°C;
    document.getElementById('result').classList.remove('hidden');
  }catch(e){document.getElementById('error').textContent=e.message;document.getElementById('error').classList.remove('hidden');}
  finally{document.getElementById('loading').classList.add('hidden');}
}
document.getElementById('city').addEventListener('keydown',e=>{if(e.key==='Enter') getWeather()});
window.onload=()=>{document.getElementById('city').value='Baghpat'; getWeather();};
</script>
</body>
</html>
