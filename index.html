<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Weather World - Live BG</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body{transition: all 1s ease; background-size: cover; background-position: center;}
.weather-card{backdrop-filter: blur(12px); background: rgba(24,24,27,0.85);}
</style>
</head>
<body id="body" class="bg-gradient-to-br from-zinc-900 via-black to-zinc-900 text-white min-h-screen flex items-center justify-center p-4">
<div class="w-full max-w-md weather-card border border-zinc-700 rounded-3xl p-6 shadow-2xl">
<h1 class="text-2xl font-bold text-center">🌍 Weather World</h1>
<p id="loc" class="text-zinc-400 text-sm text-center mt-1">Background changes with weather</p>
<p id="clock" class="text-violet-300 text-center font-bold mt-2 text-lg">🕒 Loading...</p>
<p id="clock-city" class="text-zinc-400 text-center text-xs">Live World Clock</p>

<div class="flex gap-2 mt-4">
<input id="city" placeholder="Type... e.g. London, New Delhi" class="flex-1 bg-zinc-800/80 border border-zinc-700 rounded-xl px-4 py-3 outline-none">
<button onclick="getWeather()" class="bg-violet-600 hover:bg-violet-700 px-6 rounded-xl font-bold">Go</button>
</div>

<div class="grid grid-cols-4 gap-2 mt-4 text-[11px]">
<button onclick="quick('Asia')" class="bg-zinc-800/70 rounded-lg py-2">🌏 Asia</button>
<button onclick="quick('Europe')" class="bg-zinc-800/70 rounded-lg py-2">🌍 Europe</button>
<button onclick="quick('Africa')" class="bg-zinc-800/70 rounded-lg py-2">🌍 Africa</button>
<button onclick="quick('USA')" class="bg-zinc-800/70 rounded-lg py-2">🇺🇸 USA</button>
</div>
<div class="grid grid-cols-3 gap-2 mt-2 text-xs">
<button onclick="quick('New Delhi')" class="bg-violet-600 rounded-lg py-2 font-bold">🇮🇳 New Delhi</button>
<button onclick="quick('London')" class="bg-zinc-800/70 rounded-lg py-2">London</button>
<button onclick="quick('Tokyo')" class="bg-zinc-800/70 rounded-lg py-2">Tokyo</button>
<button onclick="quick('Dubai')" class="bg-zinc-800/70 rounded-lg py-2">Dubai</button>
<button onclick="quick('Sydney')" class="bg-zinc-800/70 rounded-lg py-2">Sydney</button>
<button onclick="quick('Beijing')" class="bg-zinc-800/70 rounded-lg py-2">Beijing</button>
</div>

<div id="status" class="text-center text-sm text-zinc-400 mt-4">🔍 Search any place</div>
<div id="card" class="hidden mt-4 bg-zinc-800/80 rounded-2xl p-5 border border-zinc-700">
<div class="flex justify-between items-center"><div><p id="temp" class="text-6xl font-black">--°</p><p id="cond" class="text-zinc-200 text-lg mt-1">--</p></div><div id="icon" class="text-6xl">⛅</div></div>
<div class="grid grid-cols-3 gap-3 mt-5 text-center text-sm"><div class="bg-black/40 rounded-xl p-3"><p class="text-xs text-zinc-400">FEELS</p><p id="feels" class="font-bold text-base">--</p></div><div class="bg-black/40 rounded-xl p-3"><p class="text-xs text-zinc-400">HUMIDITY</p><p id="hum" class="font-bold text-base">--</p></div><div class="bg-black/40 rounded-xl p-3"><p class="text-xs text-zinc-400">WIND</p><p id="wind" class="font-bold text-base">--</p></div></div>
</div>
<p id="bg-label" class="text-[10px] text-zinc-500 text-center mt-3">Background auto-matches weather</p>
</div>

<script>
let cityTZ=null, cityName="Local";
function updateClock(){
  const now=new Date(); const clockEl=document.getElementById('clock'); const cityEl=document.getElementById('clock-city');
  if(!clockEl) return;
  if(cityTZ){
    try{
      const t=now.toLocaleTimeString('en-IN',{timeZone:cityTZ,hour12:true});
      const d=now.toLocaleDateString('en-IN',{timeZone:cityTZ,day:'2-digit',month:'short'});
      clockEl.innerText='🕒 '+t+' '+d;
      cityEl.innerText=cityName+' • '+cityTZ;
    }catch(e){clockEl.innerText='🕒 '+now.toLocaleString(); cityEl.innerText=cityName;}
   }else{
    clockEl.innerText='🕒 '+now.toLocaleTimeString()+' - '+now.toDateString().slice(0,10);
    cityEl.innerText='Your local time';
  }
}
setInterval(updateClock,1000);updateClock();
function quick(c){document.getElementById('city').value=c;getWeather();}

// BACKGROUND CHANGER - Matching weather
function setWeatherBG(code, isNight){
  const body=document.getElementById('body');
  const label=document.getElementById('bg-label');
  let bg="";

  if(code===0){ // Clear Sky - Sunny
    bg = isNight? "linear-gradient(to bottom, #0f172a, #1e293b)" : "linear-gradient(to bottom, #38bdf8, #facc15, #fb923c)";
    label.innerText="☀️ Sunny - Bright sunny background";
  }else if(code<=3){ // Cloudy
    bg = "linear-gradient(to bottom, #334155, #475569, #64748b)";
    label.innerText="⛅ Cloudy - Soft grey sky";
  }else if(code<=48){ // Fog
    bg = "linear-gradient(to bottom, #9ca3af, #d1d5db, #e5e7eb)";
    label.innerText="🌫️ Foggy - Misty background";
  }else if(code<=67){ // Rain / Drizzle
    bg = "linear-gradient(to bottom, #1e3a8a, #1e40af, #3b82f6)";
    label.innerText="🌧️ Rainy - Deep blue rainy background";
  }else if(code<=77){ // Snow
    bg = "linear-gradient(to bottom, #e0f2fe, #bae6fd, #ffffff)";
    label.innerText="❄️ Snowy - Icy white background";
  }else if(code<=82){ // Showers
    bg = "linear-gradient(to bottom, #312e81, #4338ca, #6366f1)";
    label.innerText="🌦️ Showers - Purple rainy background";
  }else{ // Thunderstorm
    bg = "linear-gradient(to bottom, #000, #1f1f23, #7c3aed)";
    label.innerText="⛈️ Thunderstorm - Dark storm background";
  }
  body.style.background = bg;
  body.style.minHeight="100vh";
}

async function getWeather(){
 let input=document.getElementById('city').value.trim(); if(!input){alert('Type city');return;}
 let lower=input.toLowerCase();
 const map={'asia':'Tokyo','europe':'London','africa':'Cairo','north america':'New York','south america':'Sao Paulo','australia':'Sydney','antarctica':'McMurdo Station','india':'New Delhi','usa':'Washington','china':'Beijing','uk':'London','uae':'Dubai','karnataka':'Bengaluru','delhi':'New Delhi','new delhi':'New Delhi'};
 if(map[lower]) input=map[lower];

 const status=document.getElementById('status'),card=document.getElementById('card'),loc=document.getElementById('loc');
 status.innerText='🔍 Searching '+input+'...'; card.classList.add('hidden');
 try{
  let geo=null;
  for(let q of [input, input+', India', input+', USA']){
   const r=await fetch('https://geocoding-api.open-meteo.com/v1/search?name='+encodeURIComponent(q)+'&count=1&language=en&format=json').then(x=>x.json());
   if(r.results && r.results.length>0){geo=r.results[0];break;}
  }
  if(!geo) throw new Error('Try Bengaluru, Mumbai, London');
  cityTZ=geo.timezone; cityName=geo.name; updateClock();
  loc.innerText=geo.name+', '+(geo.country||'')+' • '+geo.timezone;

  const w=await fetch('https://api.open-meteo.com/v1/forecast?latitude='+geo.latitude+'&longitude='+geo.longitude+'&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m,is_day&timezone=auto').then(x=>x.json());
  const c=w.current;

  // CHANGE BACKGROUND BASED ON WEATHER!
  setWeatherBG(c.weather_code, c.is_day===0);

  const txt={0:'Clear Sky',1:'Mainly Clear',2:'Partly Cloudy',3:'Overcast',45:'Fog',51:'Light Drizzle',61:'Light Rain',71:'Light Snow',80:'Light Showers',95:'Thunderstorm'};
  const ico={0:'☀️',1:'🌤️',2:'⛅',3:'☁️',45:'🌫️',51:'🌦️',61:'🌧️',71:'❄️',80:'🌦️',95:'⛈️'};
  document.getElementById('temp').innerText=Math.round(c.temperature_2m)+'°C';
  document.getElementById('cond').innerText=txt[c.weather_code]||'Cloudy';
  document.getElementById('icon').innerText=ico[c.weather_code]||'⛅';
  document.getElementById('feels').innerText=Math.round(c.apparent_temperature)+'°C';
  document.getElementById('hum').innerText=c.relative_humidity_2m+'%';
  document.getElementById('wind').innerText=c.wind_speed_10m+' km/h';
  status.innerText='✅ Live: '+geo.name; card.classList.remove('hidden');
 }catch(e){ status.innerText='❌ '+e.message; }
}
</script>
</body>
</html>
